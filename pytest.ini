[pytest]
minversion = 9.0
testpaths = tests
pythonpath = src
addopts =
    -ra
    --strict-markers
    --strict-config
    --junitxml=reports/junit.xml
    --html=reports/html/report.html
    --self-contained-html
    --browser=chromium
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/playwright
# xunit1 keeps per-testcase <properties>, which carry gate_id for scripts/check_gate.py
junit_family = xunit1
xfail_strict = true
markers =
    gate(matrix_id): counts toward the deterministic-test gate (one distinct matrix ID, e.g. "API-01")
    unit: framework tests; no AUT needed
    api: httpx tests against the running backend
    ui: Playwright Chromium tests
    security: characterization tests for confirmed security risks
    characterization: documents current AUT behaviour; never counted toward the gate
    needs_mysql: requires the MySQL container
    needs_backend: requires the Spring Boot backend on AUT_API_URL
    needs_frontend: requires the Vite frontend on AUT_UI_URL
    needs_seed: requires a freshly seeded database (scripts/reset_aut.sh)
