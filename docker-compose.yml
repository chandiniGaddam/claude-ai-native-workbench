# Isolated local stack for the Application Under Test (course catalogue).
#
# - Builds from the verified copy in .aut/starter_code (scripts/snapshot_aut.py), never from
#   the starter repository itself.
# - Every published port is bound to 127.0.0.1 only.
# - MySQL data lives in the named volume "mysql-data". `scripts/reset_aut.sh` removes it,
#   so each run starts from a fresh Flyway seed.
# - The MySQL root password comes from the git-ignored .env (generated by reset_aut.sh).
#   lms_app / mcp_readonly are the starter project's synthetic training credentials
#   (db-setup/01-create-users.sql, application.yml). They aren't production secrets.
name: qe-aut

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/reset_aut.sh to generate .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # copy of starter_code/db-setup/01-create-users.sql, mounted read-only
      - ./.aut/starter_code/db-setup:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # TCP ping: during first-time init MySQL runs with networking disabled, so this only
      # succeeds once the init script has finished and the real server is up.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  backend:
    build:
      context: ./.aut/starter_code/backend
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21 AS build
        WORKDIR /src
        COPY pom.xml .
        COPY src ./src
        RUN mvn -B -q -DskipTests package
        FROM maven:3.9-eclipse-temurin-21
        RUN useradd --system --uid 10001 app
        WORKDIR /app
        COPY --from=build /src/target/lms-catalog-0.1.0-SNAPSHOT.jar app.jar
        USER app
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      # Overrides application.yml's localhost URL with the compose service name. The file
      # itself is unchanged.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lms_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # SecurityConfig defines no user store, so Spring Boot generates a default user and
      # logs its password at WARN ("Using generated security password: ..."). Silence that one
      # logger so no credential reaches the logs. JSON keeps the logger name's case, which
      # LOGGING_LEVEL_* env vars can't.
      SPRING_APPLICATION_JSON: '{"logging":{"level":{"org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration":"ERROR"}}}'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      # the frontend shares this network namespace (see below), so its port is published here
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/api/courses"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60

  frontend:
    build:
      context: ./.aut/starter_code/frontend
      dockerfile_inline: |
        FROM node:22
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY . .
        RUN chown -R node:node /app
        USER node
        CMD ["npx", "vite", "--host", "0.0.0.0", "--strictPort"]
    # Shares the backend's network namespace, so the unchanged vite.config.js proxy target
    # http://localhost:8080 reaches the backend.
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

volumes:
  mysql-data:
